acl internal {
    192.168.0.0/16;
    172.16.0.0/12;
};

options {
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    allow-query { internal;
    };
    // Keep BIND's working files (including learned DNSSEC root keys) on the
    // mounted volume, so they survive container recreation
    directory "/var/cache/bind";
};

zone "home.matthomelab.xyz" IN {
    type master;
    file "/etc/bind/home-matthomelab-xyz.zone";
};
